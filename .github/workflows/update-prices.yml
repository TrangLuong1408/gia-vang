name: Cập nhật giá vàng
on:
  schedule:
    - cron: "*/15 * * * *"     # kiểm tra mỗi 5 phút, giờ chạy thật do config.json quyết định
  workflow_dispatch:           # nút "Cập nhật ngay" và chạy tay
permissions:
  contents: write
concurrency:
  group: update-prices
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra đã đến giờ chạy chưa
        id: gate
        run: python3 scripts/should_run.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Cài thư viện
        if: steps.gate.outputs.run == 'true'
        run: pip install requests beautifulsoup4
      - name: Lấy giá
        if: steps.gate.outputs.run == 'true'
        run: python scripts/fetch_prices.py
      - name: Commit nếu có giá mới
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gia-vang-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Cập nhật giá vàng" && git pull --rebase && git push)
