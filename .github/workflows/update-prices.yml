name: Cập nhật giá vàng
on:
  schedule:
    # Giờ GitHub chạy theo UTC. Việt Nam = UTC+7.
    - cron: "*/10 2 * * *"   # 09:00 - 09:50 VN
    - cron: "0 3 * * *"      # 10:00 VN
    - cron: "*/10 8 * * *"   # 15:00 - 15:50 VN
    - cron: "0 9 * * *"      # 16:00 VN
  workflow_dispatch:          # nút chạy thử bằng tay
permissions:
  contents: write
concurrency:
  group: update-prices
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_prices.py
      - name: Commit nếu có giá mới
        run: |
          git config user.name "gia-vang-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Cập nhật giá vàng" && git push)
